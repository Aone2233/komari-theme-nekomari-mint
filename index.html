<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Resolve before styles load; keep migration aligned with src/colorMode.ts.
      (() => {
        let mode = "system";
        try {
          const saved = localStorage.getItem("mint-color-mode");
          if (["system", "light", "dark"].includes(saved)) mode = saved;
          else if (localStorage.getItem("mint-dark") === "true") mode = "dark";
        } catch {}
        document.documentElement.dataset.colorMode = mode;
        document.documentElement.dataset.theme =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
      })();
    </script>
    <meta name="theme-color" content="#237551" />
    <meta
      name="description"
      content="Nekomari Mint - 清晰、真实的服务器与线路监控"
    />
    <title>Nekomari Mint</title>
    <link rel="icon" type="image/svg+xml" href="/mint.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
